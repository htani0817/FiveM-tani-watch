<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tani Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- URL入力画面 -->
    <div id="input-container" class="hidden">
        <div class="input-wrapper" role="dialog" aria-labelledby="input-title">
            <div class="input-header">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span id="input-title">Tani Watch</span>
                </div>
                <button type="button" class="close-btn" id="input-close-btn" aria-label="閉じる" title="閉じる (ESC)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="input-body">
                <label class="input-description" for="url-input">YouTube または Twitch のURLを貼り付けてください</label>

                <div class="url-input-group">
                    <div class="input-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                    </div>
                    <input type="text"
                           id="url-input"
                           placeholder="https://www.youtube.com/watch?v=... or https://www.twitch.tv/..."
                           autocomplete="off"
                           spellcheck="false"
                           maxlength="300"
                           aria-describedby="error-message">
                    <button type="button" class="paste-btn" id="paste-btn" aria-label="クリップボードから貼り付け" title="クリップボードから貼り付け">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>

                <p class="error-message hidden" id="error-message" role="alert"></p>

                <div class="supported-platforms">
                    <div class="platform-item youtube">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                        <span>YouTube</span>
                    </div>
                    <div class="platform-item twitch">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                        </svg>
                        <span>Twitch</span>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="play-btn" id="play-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>再生</span>
                    </button>
                    <button type="button" class="share-btn" id="share-btn" aria-expanded="false" aria-controls="player-list-container">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>画面共有</span>
                    </button>
                </div>

                <!-- 付近のプレイヤーリスト -->
                <div class="player-list-container hidden" id="player-list-container">
                    <div class="player-list-header">
                        <span>付近のプレイヤー</span>
                        <div class="player-list-tools">
                            <button type="button" class="list-action-btn" id="select-all-btn">全選択</button>
                            <button type="button" class="list-action-btn" id="refresh-btn" aria-label="一覧を更新" title="一覧を更新">更新</button>
                            <span class="player-count" id="player-count" aria-live="polite">0人</span>
                        </div>
                    </div>
                    <div class="player-list" id="player-list" role="group" aria-label="共有先のプレイヤー">
                        <div class="no-players">付近にプレイヤーがいません</div>
                    </div>
                    <button type="button" class="share-confirm-btn" id="share-confirm-btn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M22 2L11 13"></path>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                        </svg>
                        <span>選択したプレイヤーに共有</span>
                    </button>
                </div>
            </div>

            <div class="input-footer">
                <label class="receive-toggle" for="receive-toggle">
                    <input type="checkbox" id="receive-toggle" checked>
                    <span class="receive-toggle-track" aria-hidden="true"></span>
                    <span>共有を受け取る</span>
                </label>
                <span class="input-footer-sep" aria-hidden="true"></span>
                <span class="input-footer-hint">
                    <kbd>ESC</kbd>
                    <span>で閉じる</span>
                </span>
            </div>
        </div>
    </div>

    <!-- ビデオプレイヤー画面（コントロールのみ、動画はDUIで表示） -->
    <div id="player-container" class="hidden">
        <div class="player-controls-overlay">
            <div class="player-header">
                <div class="header-left">
                    <span class="platform-badge" id="platform-badge">YouTube</span>
                </div>
                <div class="header-right">
                    <button type="button" class="back-btn" id="back-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>戻る</span>
                    </button>
                    <button type="button" class="close-btn" id="player-close-btn" aria-label="閉じる" title="閉じる (ESC)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="controls-panel">
                <div class="volume-control">
                    <button type="button" class="volume-btn" id="volume-btn" aria-label="ミュート切り替え" title="ミュート切り替え">
                        <svg id="volume-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                        </svg>
                    </button>
                    <div class="volume-slider-container">
                        <input type="range"
                               id="volume-slider"
                               min="0"
                               max="100"
                               value="50"
                               aria-label="音量"
                               class="volume-slider">
                        <div class="volume-fill" id="volume-fill"></div>
                    </div>
                    <span class="volume-value" id="volume-value">50%</span>
                </div>

                <div class="controls-right">
                    <div class="hint">
                        <kbd>ESC</kbd>
                        <span>で閉じる</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 共有された動画の承諾確認（NUI にフォーカスが無くても表示される） -->
    <div id="share-request" class="share-request hidden" role="alertdialog" aria-labelledby="share-request-title" aria-describedby="share-request-text">
        <div class="share-request-main">
            <div class="share-request-icon" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </div>
            <div class="share-request-content">
                <div class="share-request-title" id="share-request-title">動画の共有が届きました</div>
                <div class="share-request-text" id="share-request-text"></div>
            </div>
            <div class="share-request-actions">
                <button type="button" class="share-request-accept" id="share-request-accept">視聴する</button>
                <button type="button" class="share-request-decline" id="share-request-decline">辞退</button>
            </div>
        </div>
        <div class="share-request-hint" id="share-request-hint"></div>
        <div class="share-request-timer" aria-hidden="true"><div id="share-request-bar"></div></div>
    </div>

    <!-- トースト通知 -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
